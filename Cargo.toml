[workspace]
members = [
    "crates/memspark-core",
    "crates/memspark-cli",
    "crates/memspark-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
authors = ["MemSpark Contributors"]
description = "A lightweight, explainable Windows working-set trimming tool."
repository = "https://github.com/VincentCassano/memspark"
rust-version = "1.78"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.8"
slint-build = "1.8"
thiserror = "1.0"
toml = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
